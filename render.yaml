services:
  - type: web
    name: agentic-economy-passport-api-2026
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: MANTLE_RPC_URL
        value: https://rpc.mantle.xyz
      - key: MANTLE_CHAIN_ID
        value: "5000"
      - key: MANTLE_EXPLORER_URL
        value: https://explorer.mantle.xyz
      - key: ETHERSCAN_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"

  - type: web
    name: agentic-economy-passport-demo-2026
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_BACKEND_URL
        value: https://agentic-economy-passport-api-2026.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
