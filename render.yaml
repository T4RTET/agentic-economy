services:
  - type: web
    name: agent-reputation-passport-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: passport-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: MANTLE_RPC_URL
        value: https://rpc.mantle.xyz
      - key: MANTLE_CHAIN_ID
        value: "5000"
      - key: MANTLE_EXPLORER_URL
        value: https://explorer.mantle.xyz
      - key: ETHERSCAN_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_PATH
        value: /var/data/agentic_economy.db
